<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif">
  <rect x="0" y="0" width="680" height="520" fill="#ffffff"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">结果页导出分类结构（Codex 可读版）</text>

  <rect x="40" y="48" width="150" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="115" y="67" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C">转写（转录文本）</text>
  <rect x="200" y="48" width="128" height="30" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text x="264" y="67" text-anchor="middle" font-size="13" font-weight="500" fill="#27500A">总结</text>
  <rect x="338" y="48" width="150" height="30" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="413" y="67" text-anchor="middle" font-size="13" font-weight="500" fill="#633806">媒体文件</text>
  <rect x="498" y="48" width="142" height="30" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="569" y="67" text-anchor="middle" font-size="13" font-weight="500" fill="#444441">目的地</text>

  <text x="40" y="100" font-size="12" fill="#5F5E5A">时间轴格式（自带时间轴）</text>
  <rect x="40" y="108" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="63" y="125" text-anchor="middle" font-size="12" fill="#2C2C2A">SRT</text>
  <rect x="92" y="108" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="125" text-anchor="middle" font-size="12" fill="#2C2C2A">VTT</text>
  <rect x="144" y="108" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="167" y="125" text-anchor="middle" font-size="12" fill="#2C2C2A">ASS</text>

  <text x="40" y="156" font-size="12" fill="#5F5E5A">文档格式</text>
  <rect x="40" y="162" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="63" y="179" text-anchor="middle" font-size="12" fill="#2C2C2A">TXT</text>
  <rect x="92" y="162" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="179" text-anchor="middle" font-size="12" fill="#2C2C2A">Word</text>
  <rect x="144" y="162" width="46" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="167" y="179" text-anchor="middle" font-size="12" fill="#2C2C2A">MD</text>

  <rect x="40" y="198" width="150" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="216" text-anchor="middle" font-size="11" fill="#444441">选文档格式时出现</text>
  <text x="115" y="231" text-anchor="middle" font-size="11" fill="#444441">「带时间轴」开关</text>

  <text x="40" y="264" font-size="12" fill="#5F5E5A">选项（对全部转写格式生效）</text>
  <rect x="40" y="272" width="150" height="40" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="288" text-anchor="middle" font-size="12" fill="#2C2C2A">说话人：开 / 关</text>
  <text x="115" y="303" text-anchor="middle" font-size="11" fill="#888780">无说话人数据时禁用</text>
  <rect x="40" y="320" width="150" height="52" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="115" y="337" text-anchor="middle" font-size="12" fill="#2C2C2A">语言：双语（默认）</text>
  <text x="115" y="352" text-anchor="middle" font-size="12" fill="#2C2C2A">仅翻译 / 仅原文</text>
  <text x="115" y="366" text-anchor="middle" font-size="11" fill="#888780">按翻译可用性自动回退</text>

  <text x="200" y="100" font-size="12" fill="#5F5E5A">格式</text>
  <rect x="200" y="108" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="230" y="125" text-anchor="middle" font-size="12" fill="#2C2C2A">TXT</text>
  <rect x="268" y="108" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="298" y="125" text-anchor="middle" font-size="12" fill="#2C2C2A">Word</text>
  <rect x="200" y="142" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="230" y="159" text-anchor="middle" font-size="11" fill="#2C2C2A">Markdown</text>
  <rect x="268" y="142" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="298" y="159" text-anchor="middle" font-size="12" fill="#2C2C2A">HTML</text>
  <rect x="200" y="176" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="230" y="193" text-anchor="middle" font-size="12" fill="#2C2C2A">PDF</text>
  <rect x="268" y="176" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="298" y="193" text-anchor="middle" font-size="12" fill="#2C2C2A">PPT</text>
  <rect x="200" y="210" width="60" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="230" y="227" text-anchor="middle" font-size="12" fill="#2C2C2A">长图</text>
  <rect x="200" y="250" width="128" height="58" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="264" y="268" text-anchor="middle" font-size="11" fill="#444441">说话人区分在总结</text>
  <text x="264" y="283" text-anchor="middle" font-size="11" fill="#444441">生成时已选定，导出</text>
  <text x="264" y="298" text-anchor="middle" font-size="11" fill="#444441">默认包含，无开关</text>

  <rect x="338" y="96" width="150" height="28" rx="6" fill="#fff" stroke="#BA7517" stroke-width="0.5"/>
  <text x="413" y="114" text-anchor="middle" font-size="12" fill="#633806">视频 · 烧录字幕版</text>
  <rect x="338" y="130" width="46" height="24" rx="5" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="361" y="146" text-anchor="middle" font-size="11" fill="#633806">双语</text>
  <rect x="390" y="130" width="46" height="24" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="413" y="146" text-anchor="middle" font-size="11" fill="#2C2C2A">仅翻译</text>
  <rect x="442" y="130" width="46" height="24" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="465" y="146" text-anchor="middle" font-size="11" fill="#2C2C2A">仅原文</text>
  <rect x="338" y="168" width="150" height="30" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="413" y="187" text-anchor="middle" font-size="12" fill="#2C2C2A">视频 · 原始版（无字幕）</text>
  <rect x="338" y="210" width="150" height="30" rx="6" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="413" y="229" text-anchor="middle" font-size="12" fill="#2C2C2A">音频 · 仅音频文件</text>
  <rect x="338" y="248" width="150" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="413" y="266" text-anchor="middle" font-size="11" fill="#444441">音频不可烧录字幕</text>
  <text x="413" y="281" text-anchor="middle" font-size="11" fill="#444441">字幕走「转写」导出</text>

  <rect x="498" y="96" width="142" height="30" rx="6" fill="#fff" stroke="#888780" stroke-width="0.5"/>
  <text x="569" y="115" text-anchor="middle" font-size="12" fill="#2C2C2A">本地下载（全格式）</text>
  <text x="498" y="148" font-size="12" fill="#5F5E5A">云笔记（仅文本内容）</text>
  <rect x="498" y="156" width="66" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="531" y="173" text-anchor="middle" font-size="12" fill="#2C2C2A">飞书</text>
  <rect x="570" y="156" width="70" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="605" y="173" text-anchor="middle" font-size="12" fill="#2C2C2A">Notion</text>
  <rect x="498" y="190" width="70" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="533" y="207" text-anchor="middle" font-size="11" fill="#2C2C2A">Obsidian</text>
  <rect x="574" y="190" width="66" height="26" rx="5" fill="#fff" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="607" y="207" text-anchor="middle" font-size="12" fill="#2C2C2A">其他</text>
  <rect x="498" y="232" width="142" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="569" y="250" text-anchor="middle" font-size="11" fill="#444441">只支持 转写 + 总结</text>
  <text x="569" y="265" text-anchor="middle" font-size="11" fill="#444441">媒体文件不支持云笔记</text>

  <rect x="40" y="396" width="600" height="104" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="56" y="418" font-size="13" font-weight="500" fill="#2C2C2A">关键规则（已锁定）</text>
  <text x="56" y="440" font-size="12" fill="#444441">1. SRT/VTT/ASS 必带时间轴，无「不带时间轴」一说</text>
  <text x="56" y="460" font-size="12" fill="#444441">2. 转写 = 音视频转录出的文本，不是源文件</text>
  <text x="56" y="480" font-size="12" fill="#444441">3. 纯文本即 TXT 格式</text>
  <text x="360" y="440" font-size="12" fill="#444441">4. 音频无烧录字幕，字幕单独走转写导出</text>
  <text x="360" y="460" font-size="12" fill="#444441">5. 无说话人数据时「带说话人」禁用并提示</text>
  <text x="360" y="480" font-size="12" fill="#444441">6. 翻译缺失时语言选项自动回退「仅原文」</text>
</svg>
