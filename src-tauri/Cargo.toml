[package]
name = "notebi-desktop"
version = "0.3.0"
description = "NoteBi local-first multimedia notes"
authors = ["NoteBi Contributors"]
edition = "2021"

[lib]
name = "notebi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
